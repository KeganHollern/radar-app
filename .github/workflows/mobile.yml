name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build Android release APK
        working-directory: mobile
        # No signing credentials are supplied in CI. Resource shrinking still
        # runs, which catches notification icons removed only in release builds.
        run: flutter build apk --release
      - name: Check release notification resources
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          "$build_tools/aapt" dump resources mobile/build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/apk-resources.txt"
          grep -Fq "dev.lystic.radar:drawable/ic_stat_radar" "$RUNNER_TEMP/apk-resources.txt"

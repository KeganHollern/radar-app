name: Android release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    env:
      PERMANENT_ANDROID_CERT_SHA256: f81c8c6014564eb9be0866fee60c1f7f669a29a3438ac8587aec0bd00fe19f1d
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Validate release metadata
        id: metadata
        working-directory: mobile
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(sed -nE 's/^version:[[:space:]]+([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml)"
          if [[ ! "$version_line" =~ ^([^+]+)\+([0-9]+)$ ]]; then
            echo "mobile/pubspec.yaml must contain version: <version>+<integer build>" >&2
            exit 1
          fi

          version_name="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported Android version name: $version_name" >&2
            exit 1
          fi
          if (( 10#$version_code <= 0 )); then
            echo "Android version code must be greater than zero." >&2
            exit 1
          fi

          expected_tag="v${version_name}"
          tag="${RELEASE_TAG:-$expected_tag}"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "Release tag '$tag' must match pubspec version '$expected_tag'." >&2
            exit 1
          fi

          asset="hyprradar-${tag}-android.apk"
          bundle_asset="hyprradar-${tag}-play.aab"
          {
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "asset=$asset"
            echo "bundle_asset=$bundle_asset"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Prepare release keystores
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_CERT_SHA256: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/hyprradar-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

          play_names=(
            PLAY_UPLOAD_KEYSTORE_BASE64
            PLAY_UPLOAD_KEYSTORE_PASSWORD
            PLAY_UPLOAD_KEY_ALIAS
            PLAY_UPLOAD_KEY_PASSWORD
            PLAY_UPLOAD_CERT_SHA256
          )
          play_values=0
          for name in "${play_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              ((play_values += 1))
            fi
          done
          if (( play_values != 0 && play_values != ${#play_names[@]} )); then
            echo "Configure every PLAY_UPLOAD_* secret and the PLAY_UPLOAD_CERT_SHA256 repository variable, or none of them." >&2
            exit 1
          fi

          expected_aab_cert="$PERMANENT_ANDROID_CERT_SHA256"
          play_keystore="$keystore"
          if (( play_values == ${#play_names[@]} )); then
            play_keystore="$RUNNER_TEMP/hyprradar-play-upload.p12"
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$play_keystore"
            chmod 600 "$play_keystore"
            expected_aab_cert="$(printf '%s' "$PLAY_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          fi
          if [[ ! "$expected_aab_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "PLAY_UPLOAD_CERT_SHA256 must be one SHA-256 certificate fingerprint." >&2
            exit 1
          fi
          {
            echo "PLAY_UPLOAD_KEYSTORE_PATH=$play_keystore"
            echo "PLAY_UPLOAD_EXPECTED_CERT_SHA256=$expected_aab_cert"
          } >> "$GITHUB_ENV"

      - name: Build universal signed release APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64

      - name: Build signed Play App Bundle
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.PLAY_UPLOAD_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Validate and package Android artifacts
        id: package
        env:
          ASSET: ${{ steps.metadata.outputs.asset }}
          BUNDLE_ASSET: ${{ steps.metadata.outputs.bundle_asset }}
          EXPECTED_APK_CERT_SHA256: ${{ env.PERMANENT_ANDROID_CERT_SHA256 }}
          EXPECTED_AAB_CERT_SHA256: ${{ env.PLAY_UPLOAD_EXPECTED_CERT_SHA256 }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail

          source_apk="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$source_apk"
          mkdir -p dist
          install -m 0644 "$source_apk" "dist/$ASSET"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"

          signature_report="$RUNNER_TEMP/apksigner-report.txt"
          "$apksigner" verify --verbose --print-certs "dist/$ASSET" | tee "$signature_report"
          if grep -Fq "CN=Android Debug" "$signature_report"; then
            echo "Refusing to publish an APK signed by the Android debug certificate." >&2
            exit 1
          fi
          grep -Fqx "Number of signers: 1" "$signature_report"
          if ! grep -Eq "certificate SHA-256 digest: ${EXPECTED_APK_CERT_SHA256}$" "$signature_report"; then
            echo "Refusing to publish an APK that is not signed by HyprRadar's permanent certificate." >&2
            exit 1
          fi

          badging="$RUNNER_TEMP/aapt-badging.txt"
          "$aapt" dump badging "dist/$ASSET" | tee "$badging"
          grep -Eq "^package: name='dev\.lystic\.radar' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" "$badging"
          grep -Fqx "targetSdkVersion:'36'" "$badging"
          grep -Fq "application-label:'HyprRadar'" "$badging"
          if grep -Fq "application-debuggable" "$badging"; then
            echo "Refusing to publish a debuggable APK." >&2
            exit 1
          fi
          manifest="$RUNNER_TEMP/aapt-manifest.txt"
          "$aapt" dump xmltree "dist/$ASSET" AndroidManifest.xml > "$manifest"
          if grep -Fq "android:foregroundServiceType" "$manifest"; then
            echo "Refusing to publish an undeclared location foreground service." >&2
            exit 1
          fi
          resources="$RUNNER_TEMP/aapt-resources.txt"
          "$aapt" dump resources "dist/$ASSET" > "$resources"
          grep -Fq "dev.lystic.radar:drawable/ic_stat_radar" "$resources"

          source_aab="mobile/build/app/outputs/bundle/release/app-release.aab"
          test -s "$source_aab"
          jarsigner -verify "$source_aab"
          certificate="$RUNNER_TEMP/aab-certificate.txt"
          keytool -printcert -jarfile "$source_aab" | tee "$certificate"
          actual_cert_sha256="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$certificate" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_cert_sha256" != "$EXPECTED_AAB_CERT_SHA256" ]]; then
            echo "Refusing to publish an AAB that is not signed by the expected Play upload certificate." >&2
            exit 1
          fi
          bundle_contents="$RUNNER_TEMP/aab-contents.txt"
          unzip -Z1 "$source_aab" > "$bundle_contents"
          grep -Fqx "base/res/drawable/ic_stat_radar.xml" "$bundle_contents"
          grep -Fqx "base/res/xml/backup_rules.xml" "$bundle_contents"
          grep -Fqx "base/res/xml/data_extraction_rules.xml" "$bundle_contents"
          install -m 0644 "$source_aab" "dist/$BUNDLE_ASSET"

          (
            cd dist
            sha256sum "$ASSET" > "$ASSET.sha256"
            sha256sum "$BUNDLE_ASSET" > "$BUNDLE_ASSET.sha256"
          )
          {
            echo "apk=dist/$ASSET"
            echo "apk_checksum=dist/$ASSET.sha256"
            echo "aab=dist/$BUNDLE_ASSET"
            echo "aab_checksum=dist/$BUNDLE_ASSET.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Attach Android artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          APK: ${{ steps.package.outputs.apk }}
          APK_CHECKSUM: ${{ steps.package.outputs.apk_checksum }}
          AAB: ${{ steps.package.outputs.aab }}
          AAB_CHECKSUM: ${{ steps.package.outputs.aab_checksum }}
        run: >-
          gh release upload "$TAG" "$APK" "$APK_CHECKSUM" "$AAB" "$AAB_CHECKSUM"
          --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload manual-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: hyprradar-${{ steps.metadata.outputs.tag }}-android
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk_checksum }}
            ${{ steps.package.outputs.aab }}
            ${{ steps.package.outputs.aab_checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
